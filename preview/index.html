<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Isomer</title>
  <link rel="icon" type="image/png" href="./assets/Playground-1024.png">
  <link rel="apple-touch-icon" href="./assets/Playground-1024.png">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; background: light-dark(#fff, rgb(18, 18, 20)); }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script src="./runtime/react.production.min.js?v=4056028955"></script>
  <script src="./runtime/react-dom.production.min.js?v=4056028955"></script>
  <script type="module">
    // Surface uncaught errors on the page (no devtools on a phone).
    const showError = (message) => {
      let box = document.getElementById("uui-error");
      if (!box) { box = document.createElement("pre"); box.id = "uui-error"; box.style.cssText = "position:fixed;left:8px;right:8px;bottom:8px;max-height:40%;overflow:auto;margin:0;padding:10px;font:12px monospace;color:#fff;background:#b00;border-radius:8px;z-index:2000;white-space:pre-wrap"; document.body.appendChild(box); }
      box.textContent += message + "\n";
    };
    window.addEventListener("error", (e) => showError((e.message || String(e.error)) + (e.error && e.error.stack ? "\n" + String(e.error.stack).split("\n").slice(0, 6).join("\n") : "")));
    window.addEventListener("unhandledrejection", (e) => showError("unhandled: " + (e.reason && e.reason.stack ? String(e.reason.stack).split("\n").slice(0, 6).join("\n") : String(e.reason))));
    import { boot } from "./runtime/boot.js?v=4056028955";
    // The demo runs use the Playground's service builders (its bridge links
    // the platform services; the splash's own does not).
    import { Dependencies } from "./playground/app_bridge.js?v=4056028955";

    // The inline examples use the same browser services the Playground gives a build.
    const networking = { async request(url, method) {
      const r = await fetch(url, { method: method || "GET" }); if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return new Uint8Array(await r.arrayBuffer()); },
      async send(url, method, headers, body) {
        const h = {}; for (const line of String(headers || "").split("\n")) { const i = line.indexOf(":"); if (i > 0) h[line.slice(0, i).trim()] = line.slice(i + 1).trim(); }
        const r = await fetch(url, { method: method || "GET", headers: h, body: body && body.length ? body : undefined }); if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return new Uint8Array(await r.arrayBuffer()); },
      async perform(url, method, headers, body) {
        const h = {}; for (const line of String(headers || "").split("\n")) { const i = line.indexOf(":"); if (i > 0) h[line.slice(0, i).trim()] = line.slice(i + 1).trim(); }
        const response = await fetch(url, { method: method || "GET", headers: h, body: body && body.length ? body : undefined });
        const lines = []; response.headers.forEach((value, name) => lines.push(name + ": " + value)); lines.sort();
        const head = new TextEncoder().encode(response.status + "\n" + lines.join("\n") + "\n\n");
        const bytes = new Uint8Array(await response.arrayBuffer());
        const out = new Uint8Array(head.length + bytes.length); out.set(head, 0); out.set(bytes, head.length); return out;
      },
    };
    const prefix = "isomer.splash.";
    const b64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
    const unb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
    const runDependencies = {
      networking: Dependencies.networkService(() => networking),
      file: Dependencies.fileService(() => ({
        list(p) { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith(prefix + "file:" + (p ? p + "/" : ""))) out.push(k.slice((prefix + "file:").length)); } return out.sort(); },
        exists(p) { return localStorage.getItem(prefix + "file:" + p) !== null; },
        read(p) { const v = localStorage.getItem(prefix + "file:" + p); if (v === null) throw new Error("no such file: " + p); return unb64(v); },
        write(p, c) { try { localStorage.setItem(prefix + "file:" + p, b64(c)); return true; } catch (_) { return false; } },
        delete(p) { localStorage.removeItem(prefix + "file:" + p); return true; },
        url(p) { const v = localStorage.getItem(prefix + "file:" + p); return v === null ? "" : "data:application/octet-stream;base64," + v; },
      })),
      keychain: Dependencies.keychainService(() => ({
        async get(key) { const v = localStorage.getItem(prefix + "keychain:" + key); if (v === null) throw new Error("absent"); return unb64(v); },
        async set(value, key) { localStorage.setItem(prefix + "keychain:" + key, b64(value)); },
        async delete(key) { localStorage.removeItem(prefix + "keychain:" + key); },
      })),
      analytics: Dependencies.analyticsService(() => ({ track(event) { console.log("[analytics]", event); } })),
      configuration: Dependencies.configurationService(() => ({ flag(key) { return key === "promo_banner"; } })),
    };
    // The page's commands (Splash.swift → platformCommand("splash", …)):
    // the Playground, or the Playground opened on one of the examples' source.
    window.uuiPlatformCommand = (key, value) => {
      if (key !== "splash") return;
      const command = value.split("#")[0];
      if (command === "playground") location.href = "./playground/";
      else if (command === "edit") location.href = "./playground/?template=This%20website";
      else if (command.startsWith("template:")) location.href = "./playground/?template=" + encodeURIComponent(command.slice(9));
    };

    boot({ canvas: document.getElementById("canvas"), wasmURL: "./app.wasm?v=4056028955", rendererName: "react", dependencies: runDependencies })
      .catch((error) => { document.body.insertAdjacentHTML("beforeend", '<pre id="error"></pre>'); document.getElementById("error").textContent = String(error); });
  </script>
</body>
</html>
